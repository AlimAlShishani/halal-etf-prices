name: Discover listings (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet yfinance pandas
      - run: python discover.py > listings.txt 2>&1 || true
      - run: |
          git config user.name "etf-price-bot"; git config user.email "etf-price-bot@users.noreply.github.com"
          git add listings.txt; git commit -m "Listing lookup"; git push
